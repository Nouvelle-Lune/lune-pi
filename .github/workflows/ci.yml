name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22.19.0", "24"]
        env:
            COLORTERM: truecolor
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm install --global npm@11.6.2
            - run: npm ci
            - run: npm run check
