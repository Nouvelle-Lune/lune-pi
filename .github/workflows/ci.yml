name: CI

on:
    push:
        branches: [dev, main]
    pull_request:
        branches: [dev, main]
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read

jobs:
    branch-policy:
        name: Branch policy
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Validate pull request target
              env:
                  BASE_REF: ${{ github.base_ref }}
                  HEAD_REF: ${{ github.head_ref }}
                  HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
              shell: bash
              run: |
                  case "$BASE_REF" in
                      main)
                          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
                              echo "::error::PRs to main must come from this repository's dev or hotfix branch."
                              exit 1
                          fi
                          case "$HEAD_REF" in
                              dev|codex/hotfix-?*) ;;
                              *)
                                  echo "::error::Target dev for ordinary changes. Only dev and codex/hotfix-<topic> can target main."
                                  exit 1
                                  ;;
                          esac
                          ;;
                      dev)
                          case "$HEAD_REF" in
                              main)
                                  # Strict checks require a sync branch that already contains dev.
                                  echo "::error::Merge main into a codex/sync-main-<topic> branch based on dev, then open a PR to dev."
                                  exit 1
                                  ;;
                              codex/hotfix-?*)
                                  echo "::error::Merge hotfixes into main first, then synchronize main into dev."
                                  exit 1
                                  ;;
                          esac
                          ;;
                      *)
                          echo "::error::Pull requests must target dev or main."
                          exit 1
                          ;;
                  esac

                  echo "Accepted PR route: $HEAD_REF -> $BASE_REF"

    check:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ["22.19.0", "24"]
        env:
            COLORTERM: truecolor
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm install --global npm@11.6.2
            - run: npm ci
            - name: Check formatting
              run: npm run format:check
            - name: Lint TypeScript and JavaScript
              run: npm run lint
            - name: Typecheck all packages
              run: npm run typecheck
            - name: Test all packages
              run: npm test
            - name: Check package contents
              run: npm run pack:check
